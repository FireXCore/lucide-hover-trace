name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit all dependencies (diagnostic)
        run: npm audit --audit-level=high || true
      - name: Prepare security-fixed lockfile for review
        run: |
          npm audit fix --package-lock-only
          node -e "const fs = require('node:fs'); console.log('LOCKFILE_JSON_START'); process.stdout.write(fs.readFileSync('package-lock.json', 'utf8')); console.log('LOCKFILE_JSON_END');"
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
