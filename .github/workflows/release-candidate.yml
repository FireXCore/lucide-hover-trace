name: Verified GitHub release candidate
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    if: github.repository == 'FireXCore/lucide-hover-trace'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack
      - name: Create verified pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0-rc.1 >/dev/null 2>&1; then
            echo "Release candidate already exists."
            exit 0
          fi
          gh release create v2.0.0-rc.1 lucide-hover-trace-2.0.0.tgz \
            --target "$GITHUB_SHA" \
            --title "Lucide Hover Trace 2.0 RC1" \
            --notes "Trace Studio 2.0 candidate: accessible SVG stroke modes, lightweight Web Animations engine, ESM/CJS builds and TypeScript declarations. Verified with npm audit, typecheck, build and tests. npm publishing remains gated on registry Trusted Publisher enrollment." \
            --prerelease
