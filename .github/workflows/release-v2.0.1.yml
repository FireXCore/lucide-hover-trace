name: Release Lucide Hover Trace v2.0.1 (one-shot)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v2.0.1.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: github.repository == 'FireXCore/lucide-hover-trace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate release version
        run: |
          test "$(node -p 'require("./package.json").name')" = "lucide-hover-trace"
          test "$(node -p 'require("./package.json").version')" = "2.0.1"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish GitHub Release and start OIDC npm publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view lucide-hover-trace@2.0.1 version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "lucide-hover-trace@2.0.1 is already published; skip both release and dispatch."
            exit 0
          fi
          if ! gh release view v2.0.1 >/dev/null 2>&1; then
            gh release create v2.0.1 \
              --target "$GITHUB_SHA" \
              --title "Lucide Hover Trace v2.0.1" \
              --notes "First verified OIDC Trusted Publishing release. No public API changes from v2.0.0. Publishing automation, version checks, dependency auditing, and npm provenance improvements." \
              --latest
          fi
          # GitHub suppresses release-event workflow triggers from GITHUB_TOKEN.
          # workflow_dispatch is allowed and must run on the new release tag.
          gh workflow run publish.yml --ref v2.0.1
          echo "Requested npm publishing for v2.0.1 via workflow_dispatch."
